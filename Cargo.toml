[package]
name = "tplink-easysmart"
version = "0.1.0"
edition = "2021"
description = "TUI for discovering and configuring TP-Link Easy Smart switches"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"

[profile.release]
strip = true

[lib]
name = "tplink_easysmart"
path = "src/lib.rs"

[[bin]]
name = "tplink-easysmart"
path = "src/main.rs"
